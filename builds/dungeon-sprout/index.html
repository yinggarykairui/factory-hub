<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dungeon-sprout — a seeded dungeon you walk in the dark</title>
<meta name="description" content="A seeded procedural dungeon you walk through — rooms and corridors grow from one number, and the map lights up only where you have been.">
<style>
  :root{
    --bg:#0e1013;        /* page behind everything */
    --panel:#171a1f;     /* control surfaces */
    --edge:#2a2f37;      /* hairline borders */
    --ink:#e7e9ec;       /* primary text */
    --dim:#9aa1ab;       /* secondary text */
    --accent:#6fd3b8;    /* player + active */
    --accent-ink:#06100d;
    --wall-seen:#1d2128; /* remembered wall */
    --floor-seen:#39424f;/* remembered floor (higher contrast vs wall) */
    --wall-lit:#3a414d;  /* currently visible wall */
    --floor-lit:#555f70; /* currently visible floor */
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-text-size-adjust:100%}
  body{min-height:100svh;display:flex;flex-direction:column;align-items:center;
    padding:16px;gap:14px}
  header{width:100%;max-width:760px;text-align:center}
  h1{font-size:1.4rem;margin:0 0 2px;letter-spacing:.02em}
  .tag{color:var(--dim);font-size:.82rem;margin:0}
  main{width:100%;max-width:760px;display:flex;flex-direction:column;gap:14px}
  .stage{position:relative;width:100%;aspect-ratio:3/2;background:#060708;
    border:1px solid var(--edge);border-radius:12px;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;
    image-rendering:pixelated}
  #mini{position:absolute;top:10px;right:10px;left:auto;bottom:auto;
    width:26%;max-width:128px;height:auto;aspect-ratio:3/2;
    background:rgba(6,7,8,.72);border:1px solid var(--edge);border-radius:8px}
  .hint{position:absolute;left:10px;bottom:10px;margin:0;color:var(--dim);
    font-size:.72rem;background:rgba(6,7,8,.55);padding:3px 7px;border-radius:6px;
    pointer-events:none;transition:opacity .4s}
  .hint.gone{opacity:0}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    background:var(--panel);border:1px solid var(--edge);border-radius:12px;
    padding:12px}
  .seed{display:flex;align-items:center;gap:7px;flex:1 1 200px;min-width:0}
  label{color:var(--dim);font-size:.82rem;white-space:nowrap}
  input[type=number]{flex:1;min-width:0;background:#0c0e11;color:var(--ink);
    border:1px solid var(--edge);border-radius:8px;padding:8px 10px;
    font:inherit;font-size:.9rem;-moz-appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  button{background:#232833;color:var(--ink);border:1px solid var(--edge);
    border-radius:8px;padding:8px 12px;font:inherit;font-size:.88rem;cursor:pointer;
    touch-action:manipulation}
  button:hover{border-color:#3f4855}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);
    outline-offset:1px}
  #view:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  button.primary{background:var(--accent);color:var(--accent-ink);
    border-color:var(--accent);font-weight:600}
  .stats{display:flex;gap:16px;color:var(--dim);font-size:.8rem;flex-wrap:wrap}
  .stats b{color:var(--ink);font-variant-numeric:tabular-nums}
  /* D-pad */
  .pad{display:grid;grid-template-columns:repeat(3,56px);
    grid-template-rows:repeat(3,56px);gap:8px;justify-content:center;
    align-self:center;touch-action:none}
  .pad button{width:56px;height:56px;display:flex;align-items:center;
    justify-content:center;font-size:1.3rem;border-radius:10px;padding:0}
  .pad .up{grid-area:1/2} .pad .left{grid-area:2/1}
  .pad .right{grid-area:2/3} .pad .down{grid-area:3/2}
  .pad .mid{grid-area:2/2;border:none;background:transparent;cursor:default}
  footer{color:var(--dim);font-size:.72rem;text-align:center;max-width:760px}
  footer a{color:var(--dim)}
  @media (min-width:620px){ .pad{grid-template-columns:repeat(3,52px);
    grid-template-rows:repeat(3,52px)} .pad button{width:52px;height:52px} }
  @keyframes bump{0%,100%{transform:translate(0,0)}
    30%{transform:translate(-3px,0)}70%{transform:translate(3px,0)}}
  .stage.bump{animation:bump .14s ease}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1>dungeon-sprout</h1>
  <p class="tag">One number grows a dungeon. The map lights up only where you walk.</p>
</header>

<main>
  <div class="stage">
    <canvas id="view" aria-label="Dungeon view. Use arrow keys or WASD to walk."></canvas>
    <canvas id="mini" aria-hidden="true"></canvas>
    <p class="hint">Arrow keys / WASD to move</p>
  </div>

  <div class="bar">
    <div class="seed">
      <label for="seed">seed</label>
      <input id="seed" type="number" inputmode="numeric" min="0" max="4294967295"
             step="1" aria-label="Dungeon seed — type a number and press Enter">
    </div>
    <button id="roll" class="primary" type="button">New dungeon</button>
    <button id="export" type="button">Export JSON</button>
  </div>

  <div class="bar stats" aria-live="polite">
    <span>rooms <b id="st-rooms">0</b></span>
    <span>explored <b id="st-explored">0%</b></span>
    <span>steps <b id="st-steps">0</b></span>
  </div>

  <div class="pad" role="group" aria-label="Movement pad">
    <button class="up"    type="button" data-dir="up"    aria-label="Move up">▲</button>
    <button class="left"  type="button" data-dir="left"  aria-label="Move left">◀</button>
    <span class="mid" aria-hidden="true"></span>
    <button class="right" type="button" data-dir="right" aria-label="Move right">▶</button>
    <button class="down"  type="button" data-dir="down"  aria-label="Move down">▼</button>
  </div>
</main>

<footer>
  Day 060 of an autonomous build factory —
  <a href="https://github.com/yinggarykairui/factory-hub">factory-hub</a>
</footer>

<script>
"use strict";
(function(){
  // ---- constants ---------------------------------------------------------
  var GRID_W = 48, GRID_H = 32;      // dungeon size in tiles
  var WALL = 0, FLOOR = 1;
  var MAX_ROOMS = 12, MIN_SIZE = 4, MAX_SIZE = 9, PLACE_TRIES = 160;
  var VIEW_RADIUS = 4;               // reveal disc radius (simple radius, no raycast)
  var U32 = 4294967296;              // 2^32

  // ---- seeded RNG: mulberry32 -------------------------------------------
  function mulberry32(a){
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / U32;
    };
  }
  // integer in [lo, hi] inclusive
  function randInt(rng, lo, hi){ return lo + Math.floor(rng() * (hi - lo + 1)); }

  // Coerce anything into a valid uint32 seed. Garbage -> a stable fallback.
  function cleanSeed(v){
    var n = Number(v);
    if (!isFinite(n)) return 1;
    n = Math.floor(Math.abs(n));
    if (n >= U32) n = n % U32;       // wrap huge numbers instead of overflowing
    return n >>> 0;
  }

  // ---- dungeon generation ------------------------------------------------
  // Returns {seed, w, h, tiles:Uint8Array, rooms:[{x,y,w,h}], start:{x,y}}
  function generate(seed){
    seed = cleanSeed(seed);
    // seed the RNG directly — one number, one dungeon (seed 0 included)
    var rng = mulberry32(seed);
    var w = GRID_W, h = GRID_H;
    var tiles = new Uint8Array(w * h); // all WALL
    var rooms = [];

    function overlaps(r){
      for (var i = 0; i < rooms.length; i++){
        var o = rooms[i];
        // 1-tile gap between rooms
        if (r.x <= o.x + o.w && r.x + r.w >= o.x &&
            r.y <= o.y + o.h && r.y + r.h >= o.y) return true;
      }
      return false;
    }
    function carveRoom(r){
      for (var y = r.y; y < r.y + r.h; y++)
        for (var x = r.x; x < r.x + r.w; x++)
          tiles[y * w + x] = FLOOR;
    }
    function carveH(x1, x2, y){
      var a = Math.min(x1, x2), b = Math.max(x1, x2);
      for (var x = a; x <= b; x++) tiles[y * w + x] = FLOOR;
    }
    function carveV(y1, y2, x){
      var a = Math.min(y1, y2), b = Math.max(y1, y2);
      for (var y = a; y <= b; y++) tiles[y * w + x] = FLOOR;
    }

    for (var t = 0; t < PLACE_TRIES && rooms.length < MAX_ROOMS; t++){
      var rw = randInt(rng, MIN_SIZE, MAX_SIZE);
      var rh = randInt(rng, MIN_SIZE, MAX_SIZE);
      // keep a 1-tile border so edges stay walls
      var rx = randInt(rng, 1, w - rw - 1);
      var ry = randInt(rng, 1, h - rh - 1);
      var room = {x: rx, y: ry, w: rw, h: rh};
      if (overlaps(room)) continue;
      carveRoom(room);
      if (rooms.length > 0){
        // connect to the previous room's centre with an L-shaped corridor,
        // so the whole set is one connected graph (every room reachable)
        var prev = rooms[rooms.length - 1];
        var cx = (room.x + (room.w >> 1)), cy = (room.y + (room.h >> 1));
        var px = (prev.x + (prev.w >> 1)), py = (prev.y + (prev.h >> 1));
        if (rng() < 0.5){ carveH(px, cx, py); carveV(py, cy, cx); }
        else            { carveV(py, cy, px); carveH(px, cx, cy); }
      }
      rooms.push(room);
    }

    // Degenerate guard: a seed that placed no room still gets one, centred.
    if (rooms.length === 0){
      var fr = {x: (w >> 1) - 2, y: (h >> 1) - 2, w: 4, h: 4};
      carveRoom(fr); rooms.push(fr);
    }

    var first = rooms[0];
    var start = {x: first.x + (first.w >> 1), y: first.y + (first.h >> 1)};
    return {seed: seed, w: w, h: h, tiles: tiles, rooms: rooms, start: start};
  }

  // ---- state -------------------------------------------------------------
  var dungeon = null;
  var seen = null;        // Uint8Array: has this tile ever been revealed?
  var player = {x: 0, y: 0};
  var steps = 0;

  function isFloor(x, y){
    if (x < 0 || y < 0 || x >= dungeon.w || y >= dungeon.h) return false;
    return dungeon.tiles[y * dungeon.w + x] === FLOOR;
  }

  function reveal(){
    var r = VIEW_RADIUS, r2 = r * r;
    for (var dy = -r; dy <= r; dy++){
      for (var dx = -r; dx <= r; dx++){
        if (dx*dx + dy*dy > r2) continue;
        var x = player.x + dx, y = player.y + dy;
        if (x < 0 || y < 0 || x >= dungeon.w || y >= dungeon.h) continue;
        seen[y * dungeon.w + x] = 1;
      }
    }
  }

  function visibleNow(x, y){
    var dx = x - player.x, dy = y - player.y;
    return dx*dx + dy*dy <= VIEW_RADIUS * VIEW_RADIUS;
  }

  function newDungeon(seed, pushHash){
    dungeon = generate(seed);
    seen = new Uint8Array(dungeon.w * dungeon.h);
    player.x = dungeon.start.x; player.y = dungeon.start.y;
    steps = 0;
    reveal();
    if (pushHash) location.hash = String(dungeon.seed);
    seedInput.value = String(dungeon.seed);
    draw(); drawMini(); updateStats();
  }

  var stageEl = document.querySelector('.stage');
  var hintEl = document.querySelector('.hint');
  function bump(){                      // brief nudge when a wall blocks you
    if (!stageEl) return;
    stageEl.classList.remove('bump');
    void stageEl.offsetWidth;           // reflow so the animation can restart
    stageEl.classList.add('bump');
  }
  function move(dx, dy){
    var nx = player.x + dx, ny = player.y + dy;
    if (!isFloor(nx, ny)){ bump(); return; }   // walls and edges block
    player.x = nx; player.y = ny; steps++;
    if (hintEl) hintEl.classList.add('gone');  // hide the hint after first move
    reveal(); draw(); drawMini(); updateStats();
  }

  // ---- rendering ---------------------------------------------------------
  var view = document.getElementById('view');
  var vctx = view.getContext('2d');
  var mini = document.getElementById('mini');
  var mctx = mini.getContext('2d');
  var viewCols = 0, viewRows = 0, tilePx = 0;

  function fitCanvas(cv){
    var dpr = Math.min(window.devicePixelRatio || 1, 2); // cap dpr (perf)
    var r = cv.getBoundingClientRect();
    var w = Math.max(1, Math.round(r.width * dpr));
    var h = Math.max(1, Math.round(r.height * dpr));
    if (cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
    return dpr;
  }

  function draw(){
    if (!dungeon) return;
    fitCanvas(view);
    var W = view.width, H = view.height;
    vctx.fillStyle = '#060708';
    vctx.fillRect(0, 0, W, H);

    // tile size: aim for a window of ~17 tiles across, clamped sane
    tilePx = Math.max(10, Math.floor(W / 17));
    viewCols = Math.ceil(W / tilePx);
    viewRows = Math.ceil(H / tilePx);

    // camera centred on player, clamped to dungeon bounds
    var camX = player.x - (viewCols >> 1);
    var camY = player.y - (viewRows >> 1);
    camX = Math.max(0, Math.min(camX, dungeon.w - viewCols));
    camY = Math.max(0, Math.min(camY, dungeon.h - viewRows));
    if (dungeon.w <= viewCols) camX = -((viewCols - dungeon.w) >> 1);
    if (dungeon.h <= viewRows) camY = -((viewRows - dungeon.h) >> 1);

    for (var sy = 0; sy < viewRows; sy++){
      for (var sx = 0; sx < viewCols; sx++){
        var gx = camX + sx, gy = camY + sy;
        if (gx < 0 || gy < 0 || gx >= dungeon.w || gy >= dungeon.h) continue;
        var idx = gy * dungeon.w + gx;
        if (!seen[idx]) continue;                 // never seen -> black
        var floor = dungeon.tiles[idx] === FLOOR;
        var lit = visibleNow(gx, gy);
        vctx.fillStyle = floor
          ? (lit ? cssVar('--floor-lit') : cssVar('--floor-seen'))
          : (lit ? cssVar('--wall-lit')  : cssVar('--wall-seen'));
        vctx.fillRect(sx * tilePx, sy * tilePx, tilePx + 1, tilePx + 1);
      }
    }

    // player glyph: the roguelike @, drawn centred in its tile
    var pxl = (player.x - camX) * tilePx, pyl = (player.y - camY) * tilePx;
    vctx.fillStyle = cssVar('--accent');
    vctx.font = 'bold ' + Math.floor(tilePx * 0.92) +
      'px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
    vctx.textAlign = 'center';
    vctx.textBaseline = 'middle';
    vctx.fillText('@', pxl + tilePx / 2, pyl + tilePx / 2 + Math.floor(tilePx * 0.06));
  }

  function drawMini(){
    if (!dungeon) return;
    fitCanvas(mini);
    var W = mini.width, H = mini.height;
    mctx.clearRect(0, 0, W, H);
    var cw = W / dungeon.w, ch = H / dungeon.h;
    for (var y = 0; y < dungeon.h; y++){
      for (var x = 0; x < dungeon.w; x++){
        var idx = y * dungeon.w + x;
        if (!seen[idx]) continue;
        mctx.fillStyle = dungeon.tiles[idx] === FLOOR
          ? 'rgba(111,211,184,.55)' : 'rgba(120,130,145,.28)';
        mctx.fillRect(x * cw, y * ch, Math.ceil(cw), Math.ceil(ch));
      }
    }
    // player dot
    mctx.fillStyle = cssVar('--accent');
    var d = Math.max(2, Math.ceil(cw));
    mctx.fillRect(player.x * cw - d/2 + cw/2, player.y * ch - d/2 + ch/2, d, d);
  }

  // read a CSS custom property once per call (cheap; values are static)
  var _varCache = {};
  function cssVar(name){
    if (_varCache[name]) return _varCache[name];
    var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    _varCache[name] = v || '#888';
    return _varCache[name];
  }

  function updateStats(){
    document.getElementById('st-rooms').textContent = dungeon.rooms.length;
    document.getElementById('st-steps').textContent = steps;
    var floorTotal = 0, floorSeen = 0;
    for (var i = 0; i < dungeon.tiles.length; i++){
      if (dungeon.tiles[i] === FLOOR){ floorTotal++; if (seen[i]) floorSeen++; }
    }
    var pct = floorTotal ? Math.round(100 * floorSeen / floorTotal) : 0;
    document.getElementById('st-explored').textContent = pct + '%';
  }

  // ---- export ------------------------------------------------------------
  function exportJSON(){
    // compact row-strings keep the file readable and small
    var rows = [];
    for (var y = 0; y < dungeon.h; y++){
      var s = '';
      for (var x = 0; x < dungeon.w; x++) s += dungeon.tiles[y*dungeon.w + x];
      rows.push(s);
    }
    var data = {
      format: 'dungeon-sprout/1',
      seed: dungeon.seed,
      width: dungeon.w, height: dungeon.h,
      start: dungeon.start,
      rooms: dungeon.rooms,
      legend: {'0': 'wall', '1': 'floor'},
      tiles: rows
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'dungeon-' + dungeon.seed + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  // ---- input -------------------------------------------------------------
  var seedInput = document.getElementById('seed');

  var KEYMAP = {
    ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
    w:[0,-1], s:[0,1], a:[-1,0], d:[1,0],
    W:[0,-1], S:[0,1], A:[-1,0], D:[1,0]
  };
  window.addEventListener('keydown', function(e){
    if (e.target === seedInput) return;          // typing a seed, not walking
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var m = KEYMAP[e.key];
    if (!m) return;
    e.preventDefault();                          // stop the page from scrolling
    move(m[0], m[1]);
  });

  // D-pad: a click handler; touch-action:manipulation removes the tap delay
  document.querySelectorAll('.pad button[data-dir]').forEach(function(btn){
    var dir = btn.getAttribute('data-dir');
    var m = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]}[dir];
    btn.addEventListener('click', function(){ move(m[0], m[1]); });
  });

  document.getElementById('roll').addEventListener('click', function(){
    newDungeon(Math.floor(Math.random() * U32), true);
    view.focus && view.focus();
  });
  document.getElementById('export').addEventListener('click', exportJSON);

  function applySeedInput(){
    var s = cleanSeed(seedInput.value);
    newDungeon(s, true);
  }
  seedInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); applySeedInput(); }
  });
  seedInput.addEventListener('change', applySeedInput);

  // hash: shareable seed. Invalid/empty -> a fresh random one.
  window.addEventListener('hashchange', function(){
    var h = location.hash.replace(/^#/, '');
    if (h === '' ) return;
    var s = cleanSeed(h);
    if (!dungeon || s !== dungeon.seed) newDungeon(s, false);
  });

  var _resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(_resizeTimer);
    _resizeTimer = setTimeout(function(){ draw(); drawMini(); }, 80);
  });

  // make the view keyboard-focusable so the hint applies on desktop
  view.setAttribute('tabindex', '0');

  // ---- boot --------------------------------------------------------------
  function boot(){
    var h = location.hash.replace(/^#/, '');
    var picked = (h === '');
    var seed = picked ? Math.floor(Math.random() * U32) : cleanSeed(h);
    newDungeon(seed, picked);  // only push a hash when we picked the seed
    // normalise a garbage/overflow hash to the real seed, without a history entry
    if (!picked && h !== String(seed) && history.replaceState){
      history.replaceState(null, '', '#' + seed);
    }
  }
  boot();
})();
</script>
</body>
</html>
